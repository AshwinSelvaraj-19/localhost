<div align="center">

    <h2>PHP Practical Program Finder</h2>

    <form id="programForm">
        <table>
            <tr>
                <td>
                    <label for="programId">Employee ID / Program ID:</label>
                </td>

                <td>
                    <input
                        type="number"
                        id="programId"
                        min="1"
                        max="10"
                        placeholder="Enter ID"
                        required
                    >
                </td>

                <td>
                    <button type="submit">Submit</button>
                </td>
            </tr>
        </table>
    </form>

    <h3 id="programTitle">Selected Program</h3>

    <pre id="programContent">Enter an ID from 1 to 10.</pre>

    <button type="button" id="copyButton" disabled>
        Copy Program
    </button>

    <p id="message"></p>

</div>

<script>
    const form = document.getElementById("programForm");
    const programId = document.getElementById("programId");
    const programTitle = document.getElementById("programTitle");
    const programContent = document.getElementById("programContent");
    const copyButton = document.getElementById("copyButton");
    const message = document.getElementById("message");

    let selectedProgram = "";

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const id = Number(programId.value);

        if (id < 1 || id > 10) {
            message.textContent = "Enter a number between 1 and 10.";
            return;
        }

        const fileName = "ex" + id + ".txt";

        try {
            const response = await fetch(fileName);

            if (!response.ok) {
                throw new Error("File not found");
            }

            selectedProgram = await response.text();

            programTitle.textContent = "Experiment " + id;
            programContent.textContent = selectedProgram;
            copyButton.disabled = false;
            message.textContent = fileName + " loaded successfully.";

        } catch (error) {
            selectedProgram = "";
            programContent.textContent = "";
            copyButton.disabled = true;
            message.textContent = "Unable to load " + fileName + ".";
        }
    });

    copyButton.addEventListener("click", async function () {
        if (selectedProgram !== "") {
            await navigator.clipboard.writeText(selectedProgram);
            message.textContent = "Program copied successfully.";
        }
    });
</script>
