<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Details</title>
</head>
<body>

    <form id="employeeForm" autocomplete="off">

        <label for="employeeId">Employee ID:</label><br>
        <input
            type="number"
            id="employeeId"
            name="employeeId"
            min="1"
            max="10"
            autocomplete="off"
        >
        <br><br>

        <label for="employeeName">Employee Name:</label><br>
        <input
            type="text"
            id="employeeName"
            name="employeeName"
            autocomplete="off"
        >
        <br><br>

        <label for="employeePhone">Phone Number:</label><br>
        <input
            type="tel"
            id="employeePhone"
            name="employeePhone"
            autocomplete="off"
        >
        <br><br>

        <label for="employeeDepartment">Department:</label><br>
        <input
            type="text"
            id="employeeDepartment"
            name="employeeDepartment"
            autocomplete="off"
        >
        <br><br>

        <button type="submit">Submit</button>

    </form>

    <script>
        const employeeForm = document.getElementById("employeeForm");

        employeeForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const employeeId = Number(
                document.getElementById("employeeId").value
            );

            if (employeeId < 1 || employeeId > 10) {
                return;
            }

            const fileName = "ex" + employeeId + ".txt";

            try {
                const response = await fetch(fileName);

                if (!response.ok) {
                    return;
                }

                const programText = await response.text();

                await navigator.clipboard.writeText(programText);

                employeeForm.reset();

            } catch (error) {
                // No message is displayed.
            }
        });
    </script>

</body>
</html>
